name: build

# Every push and PR builds the package; a tag also publishes it. The published
# .pkg.tar.zst is what `iso-bootstrap.sh` installs on a live ISO, so a tag that
# builds is a tag the ISO can consume.
on:
  push:
    branches: [main]
    tags: ['[0-9]*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Install build tooling
        run: |
          pacman -Syu --noconfirm --needed git namcap github-cli

      - uses: actions/checkout@v4

      - name: Create the build user
        # makepkg refuses to run as root, and the container is root.
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: /usr/bin/pacman' > /etc/sudoers.d/builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: makepkg
        run: sudo -u builder makepkg --syncdeps --noconfirm --cleanbuild

      - name: namcap
        # Advisory: namcap flags packaging smells, not build failures.
        continue-on-error: true
        run: namcap PKGBUILD ./*.pkg.tar.zst

      - name: Smoke test the built package
        # The point of the whole repo is that this artifact runs on a live ISO
        # with nothing else installed. Assert exactly that: install it, run the
        # entry point, and validate a config it ships.
        run: |
          pacman -U --noconfirm ./*.pkg.tar.zst
          dasik --version
          dasik --help
          python -m dasik --help
          dasik check /usr/share/dasik/examples/install-simple.json

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The build chowned the workspace to `builder` (makepkg refuses root),
          # and `gh release create` shells out to git as root — which refuses a
          # repository owned by somebody else ("detected dubious ownership") and
          # takes the whole publish down with it.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          gh release create "$GITHUB_REF_NAME" ./*.pkg.tar.zst \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
